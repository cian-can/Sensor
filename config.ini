[network]
; 传感器设备地址（模拟模式下为本机回环）
host = 127.0.0.1
port = 9000
; 重连间隔（毫秒）
reconnect_interval = 3000
; 最大重连次数（0=无限）
max_reconnect = 0
; 心跳间隔（毫秒）
heartbeat_interval = 5000

[acquisition]
; 采样频率（Hz），模拟服务端按此频率发送
sample_rate = 50
; 启用模拟传感器（true=内置模拟服务端，false=连接真实设备）
mock_sensor = true

[ui]
; 界面刷新帧率（FPS）
refresh_fps = 30
; 曲线最大显示点数（滑动窗口）
max_points = 1000
; 曲线颜色（十六进制）
color_temp   = #FF6B6B
color_pressure = #4ECDC4
color_humidity = #45B7D1
color_vibration = #FFA07A

[alarm]
; 温度告警阈值（℃）
temp_high = 80.0
temp_low  = -10.0
; 压力告警阈值（kPa）
pressure_high = 500.0
; 湿度告警阈值（%RH）
humidity_high = 90.0

[storage]
; SQLite数据库文件路径
db_path = sensor_data.db
; 批量写入间隔（毫秒）
flush_interval = 1000
; 批量写入最大条数
batch_size = 500

[log]
; 日志级别: trace/debug/info/warn/error/critical
level = info
; 日志文件路径
file = forest_breed.log
; 单文件最大大小（MB）
max_size = 10
; 保留文件数
max_files = 5

[camera]
; 是否启用定时拍照功能
enabled = true
; 摄像头设备索引（通常0为默认摄像头）
device_index = 0
; 拍照间隔（小时）
interval_hours = 2
; 照片保留天数（超过自动删除，默认30天=1个月）
retention_days = 30
; 照片保存目录（相对/绝对路径）
photo_dir = photos
; JPG照片质量（0-100）
quality = 90
